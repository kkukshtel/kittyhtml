name: Publish to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: macos-latest
            target: x86_64-apple-darwin
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    name: build-${{ matrix.target }}
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/renderer

      # npm ci insists optionalDependencies be resolvable in the lockfile,
      # but our optional native-platform subpackages don't exist on npm
      # until this very workflow publishes them. Use npm install instead.
      - run: npm install --no-audit --no-fund --no-save --omit=optional

      - name: Build native
        run: |
          npx napi build \
            --release \
            --platform \
            --target ${{ matrix.target }} \
            --manifest-path crates/renderer/Cargo.toml \
            --package-json-path package.json \
            --output-dir crates/renderer

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: crates/renderer/kittyhtml-native.*.node
          if-no-files-found: error

  publish:
    name: Publish all packages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # npm ci insists optionalDependencies be resolvable in the lockfile,
      # but our optional native-platform subpackages don't exist on npm
      # until this very workflow publishes them. Use npm install instead.
      - run: npm install --no-audit --no-fund --no-save --omit=optional

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Move artifacts into per-platform npm dirs
        run: |
          npx napi artifacts \
            --package-json-path package.json \
            --npm-dir npm \
            --build-output-dir crates/renderer

      - name: Sync platform versions + umbrella's optionalDependencies
        run: |
          UMBRELLA_VERSION=$(node -p "require('./package.json').version")
          echo "umbrella version: $UMBRELLA_VERSION"
          # Stamp each platform subpackage's version.
          for dir in npm/*/; do
            node -e "
              const fs = require('fs');
              const path = '${dir}package.json';
              const p = JSON.parse(fs.readFileSync(path, 'utf8'));
              p.version = '$UMBRELLA_VERSION';
              fs.writeFileSync(path, JSON.stringify(p, null, 2) + '\n');
              console.log('stamped ' + path + ' → ' + p.version);
            "
          done
          # Stamp the umbrella's optionalDependencies → all platform packages
          # point at the current umbrella version, so a fresh
          # `npm install kittyhtml@X.Y.Z` resolves to matching natives.
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const v = p.version;
            for (const name of Object.keys(p.optionalDependencies || {})) {
              p.optionalDependencies[name] = v;
              console.log('optionalDep ' + name + ' → ' + v);
            }
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          "

      # We skip `napi pre-publish` because it expects a release commit
      # (from `npm version`) and we trigger via workflow_dispatch. The
      # per-platform package.json files already carry the umbrella's
      # current version, stamped by `napi create-npm-dirs` at setup time.
      - name: Verify per-platform .node files are in place
        run: |
          for dir in npm/*/; do
            target=$(basename "$dir")
            echo "--- $target ---"
            ls -la "$dir"
            test -f "$dir/kittyhtml-native.$target.node" || { echo "missing native binary in $dir"; exit 1; }
          done

      - name: Publish platform packages
        run: |
          set -e
          for dir in npm/*/; do
            echo "Publishing $dir"
            (cd "$dir" && npm publish --provenance --access public)
          done

      - name: Publish umbrella package
        run: npm publish --provenance --access public
