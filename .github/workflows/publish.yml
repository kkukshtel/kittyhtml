name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Node 24 LTS ships with npm 11.x, which has OIDC trusted-publishing
      # support built in. We don't run a `npm install -g npm@latest` upgrade
      # step because the bundled npm in older Node 22 images shipped broken
      # (missing transitive deps like `promise-retry`), so any install call
      # crashed before publish could run.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Show npm version
        run: npm --version

      - name: Publish
        run: npm publish --provenance --access public
