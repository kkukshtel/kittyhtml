[package]
name = "kittyhtml-renderer"
version = "0.0.1"
edition = "2024"
description = "HTML → PNG via Blitz, headless (Vello CPU). Spike binary for kittyhtml v0.3.0."
license = "MIT"
publish = false

[[bin]]
name = "spike"
path = "src/main.rs"

[dependencies]
# Pinned to the same versions himg uses, since they've already shaken out
# combos that work together on Blitz's release candidate.
blitz-traits = "0.1.0-rc.2"
blitz-dom = "0.1.0-rc.2"
blitz-html = "0.1.0-rc.2"
blitz-paint = "0.1.0-rc.2"
anyrender = "0.5.0"
anyrender_vello_cpu = "0.5.1"
tokio = { version = "1.46", features = ["rt-multi-thread", "macros"] }
png = "0.17"

[profile.release]
# Spike-friendly: faster compile than the default release profile.
opt-level = 2
lto = false
